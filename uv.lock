resolution-markers = [
    "python_full_version >= '3.12' and sys_platform == 'linux'",
    "python_full_version >= '3.12' and sys_platform != 'linux'",
    "python_full_version == '3.11.*' and sys_platform == 'linux'",
    "python_full_version == '3.11.*' and sys_platform != 'linux'",
    "python_full_version < '3.11' and sys_platform == 'linux'",
    "python_full_version < '3.11' and sys_platform != 'linux'",
]

