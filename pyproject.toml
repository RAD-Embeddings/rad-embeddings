[project]
name = "rad-embeddings"
version = "0.1.3"
description = "RAD Embeddings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "distrax>=0.1.5",
    "jax<=0.4.38",
    "dfa-gym",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
dfa-gym = { path = "../dfa-gym" }
