[project]
name = "rad-embeddings"
version = "0.1.3"
description = "RAD Embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "distrax>=0.1.5",
    "jax<=0.4.38",
    "jraph>=0.0.6.dev0",
    "dfax",
    "optax>=0.2.5",
    "flax>=0.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
dfax = { path = "../dfax" }
